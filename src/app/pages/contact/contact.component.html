<section class="contact">
    <div class="contact-forms">
        <h2 class="contact-forms__title">¿Listo para transformar tu empresa?</h2>
        <p class="contact-forms__description">Contáctanos hoy mismo y descubre cómo podemos ayudarte a alcanzar tus
            objetivos
            de
            negocio.</p>
        <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="submitMessage()">
            <div class="contact-form-user">
                <div class="contact-form-user-name">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" formControlName="name">
                </div>
            </div>
            <div class="contact-form-email">
                <label for="email">Correo</label>
                <input type="email" id="email" formControlName="email">
            </div>
            <div class="contact-form-message">
                <label for="message">Comentario o mensaje</label>
                <textarea id="message" formControlName="message"></textarea>
            </div>
            <div class="contact-form-submit">
                <button type="submit" [disabled]="isLoading">
                    <ng-container *ngIf="!isLoading; else loadingTemplate">
                        Enviar
                    </ng-container>
                    <ng-template #loadingTemplate>
                        Enviando...
                    </ng-template>
                </button>
            </div>

        </form>
    </div>
    <div class="contact-information">
        <h2 class="contact-information__title">Información de contacto</h2>
        <div class="contact-information__cards">
            <div class="contact-information__card" *ngFor="let card of cards">
                <button class="contact-information__card-button-copy" (click)="copyToClipboard(card.content)">
                    <span class="material-icons">
                        content_copy
                    </span> </button>
                <h3 class="contact-information__card-icon" [ngClass]="{'dark': isDark}">
                    <span class="material-icons">
                        {{ card.icon }}
                    </span>
                </h3>
                <div class="contact-information__card-content" [ngClass]="{'dark': isDark}">
                    <p class="contact-information__card-content-subtitle">{{card.title}}</p>
                    <p class="contact-information__card-content-title">{{card.content}}</p>

                </div>
            </div>
        </div>
        <h3 class="contact-information__title">Búsqueda de correos por área</h3>
        <select class="select-emails-filter" (change)="filterByEmail($event)">
            <option *ngFor="let email of emailsFlattened" [value]="email" [selected]="email === defaultEmail">
                {{ email }}
            </option>
        </select>
        <div class="contact-information__card-email" *ngFor="let email of emailsForArea">
            <span class="material-icons">
                {{email.icon}}
            </span>
            <h3 class="name">
                {{email.area}}
            </h3>
            <p class="email">{{email.value}}</p>
        </div>
        <h3 class="contact-information__title">Síguenos</h3>
        <div class="contact-information__networks">
            <a class="contact-information__network" *ngFor="let network of networks" [href]="network.link"
                target="_blank">
                <img [src]="network.image" [alt]="network.name">
            </a>
        </div>
    </div>
</section>
<div *ngIf="isTextCopied">
    <app-modal-confirmation [message]="'Texto copiado: ' + `${textCopied}`" [typeMessage]="'success'"
        (newItemEvent)="isTextCopied = false"></app-modal-confirmation>
</div>
<div *ngIf="isEmailSend">
    <app-modal-confirmation [typeMessage]="isSuccessMessage ? 'success' : 'error'" [message]="sendText" (newItemEvent)="isEmailSend = false"></app-modal-confirmation>
</div>
